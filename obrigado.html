<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Abrindo o WhatsApp · Pedras Decorativas</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Cormorant';src:url('assets/fonts/cormorant-latin.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Jost';src:url('assets/fonts/jost-latin.woff2') format('woff2');font-weight:300 500;font-display:swap}
*{margin:0;box-sizing:border-box}
body{font-family:'Jost',system-ui,sans-serif;font-weight:300;background:#103848;color:#EDE7DC;
  min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem}
.caixa{max-width:38ch}
.los{width:46px;height:46px;margin:0 auto 1.6rem}
h1{font-family:'Cormorant',Georgia,serif;font-weight:400;font-size:2rem;line-height:1.14;
  margin-bottom:.75rem;color:#E3D6BC}
.it{font-style:italic;color:#D0C0A0}
p{color:rgba(237,231,220,.72);font-size:.98rem;line-height:1.64}
.giro{width:32px;height:32px;margin:1.9rem auto 0;border:2px solid rgba(208,192,160,.22);
  border-top-color:#D0C0A0;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.manual{margin-top:1.6rem;display:none}
.manual a{display:inline-flex;align-items:center;min-height:48px;border:1px solid rgba(208,192,160,.4);
  border-radius:2px;padding:.8rem 1.6rem;font-size:.92rem;color:#E3D6BC;text-decoration:none}
.manual a:hover{border-color:#D0C0A0;background:rgba(208,192,160,.1)}
a{color:#D0C0A0}
@media (prefers-reduced-motion:reduce){.giro{animation:none}}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NMVF76DC"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="caixa">
  <svg class="los" viewBox="0 0 64 64" aria-hidden="true" fill="#D0C0A0">
    <rect x="8" y="8" width="21" height="21" rx="1.5"/>
    <rect x="34" y="12" width="16" height="16" rx="1.5" opacity=".62"/>
    <rect x="11" y="35" width="16" height="16" rx="1.5" opacity=".62"/>
    <rect x="32" y="33" width="21" height="21" rx="1.5"/>
  </svg>
  <h1>Abrindo o seu <span class="it">WhatsApp</span></h1>
  <p id="msg">Um instante, estamos levando você para a conversa com a Pedras Decorativas.</p>
  <div class="giro" id="giro"></div>
  <div class="manual" id="manual"><a id="ir" href="#">Abrir a conversa</a></div>
</div>
<script>
(function(){
  function q(k){ return new URLSearchParams(location.search).get(k) || ''; }
  var n = q('n'), t = q('t') || '';

  // Servidor com URL limpa redireciona /obrigado.html para /obrigado, e ha
  // quem descarte a query nesse pulo. O site guarda os mesmos dados no
  // sessionStorage antes de sair, entao aqui eles sao recuperados e o lead
  // nao chega no WhatsApp com a conversa em branco.
  if (!n) {
    try {
      var g = JSON.parse(sessionStorage.getItem('pn_wa') || '{}');
      n = g.n || ''; t = g.t || t;
    } catch (e) {}
  }
  try { sessionStorage.removeItem('pn_wa'); } catch (e) {}

  var valido = n && /^[0-9]{10,15}$/.test(n);
  var alvo = valido ? ('https://wa.me/' + n + (t ? ('?text=' + encodeURIComponent(t)) : '')) : '';

  var manual = document.getElementById('manual'), ir = document.getElementById('ir'),
      giro = document.getElementById('giro'), msg = document.getElementById('msg');

  var partiu = false, tagOk = false, minimo = false;
  function vai(){ if (partiu || !valido) return; partiu = true; location.href = alvo; }
  function tenta(){ if (tagOk && minimo) vai(); }

  // Evento de conversao. Sair da pagina mata a tag que ainda nao disparou, e e
  // pra contar esse clique que esta pagina existe. Por isso o redirecionamento
  // espera o eventCallback: o GTM so o chama depois que todas as tags ligadas
  // ao evento dispararam (ou na hora, se nenhuma estiver ligada).
  // O teto de 2,6s cobre GTM bloqueado por adblock: ai o callback nunca vem, e
  // ninguem pode ficar preso esperando.
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'whatsapp_click', destino: 'Pedras Decorativas',
    eventCallback: function(){ tagOk = true; tenta(); },
    eventTimeout: 2000
  });

  if (valido) {
    ir.href = alvo;
    // 0,9s de tela minima: sem isso, com a tag em cache, a pagina so pisca
    setTimeout(function(){ minimo = true; tenta(); }, 900);
    setTimeout(vai, 2600);
    setTimeout(function(){ giro.style.display='none'; manual.style.display='block'; }, 3200);
  } else {
    giro.style.display='none';
    msg.innerHTML = 'Não conseguimos montar o link. Fale com a Pedras Decorativas pelo telefone ' +
      '<a href="tel:+551143191505">(11) 4319-1505</a>.';
    manual.style.display='block';
    ir.textContent = 'Voltar ao site'; ir.href = 'index.html';
  }
})();
</script>
</body>
</html>
